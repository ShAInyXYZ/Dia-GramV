<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
  <!-- Dia-GramV banner.
       The mark IS a diagram: the three cards use shapePath() from
       packages/core/src/shapes.js, so they are literally the shapes the canvas
       draws — a pill API, a tabbed module, a cylinder store — in the catalog's
       own colours.
       The red wire is the point of the tool. A store does not initiate calls to
       a module; that is kind/store-initiates, a real diagnostic DGV emits, and
       showing it caught is the whole pitch. Version is deliberately NOT baked
       in here: in an SVG it goes stale silently. -->
  <rect width="1280" height="300" fill="#0e0d0b"/>

  <!-- corner meta, uniform 34px margin -->
  <text x="34" y="46" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1.2" fill="#7d766c">MCP · Svelte Flow · dagre</text>
  <text x="1246" y="46" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="1.4" fill="#e8873a">dgv/&lt;name&gt;.dgv.json</text>
  <text x="34" y="274" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1.2" fill="#7d766c">MIT · Node 20+ · local only</text>
  <text x="1246" y="274" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1.2" fill="#7d766c">No accounts · No cloud · No telemetry</text>

  <!-- ── the diagram ─────────────────────────────────────────────── -->
  <!-- api ▸ module : a plain call -->
  <path d="M228,105 L292,105" stroke="#6a655d" stroke-width="1.5" fill="none"/>
  <polygon points="0,0 -9,-4 -9,4" fill="#6a655d" transform="translate(292 105)"/>
  <text x="260" y="97" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#7d766c">http</text>

  <!-- module ▸ store : a write -->
  <path d="M375,140 L375,182" stroke="#6a655d" stroke-width="2" stroke-dasharray="2 4" fill="none"/>
  <polygon points="0,0 -9,-4 -9,4" fill="#6a655d" transform="translate(375 182) rotate(90)"/>
  <text x="389" y="167" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#7d766c">upsert</text>

  <!-- store ▸ api : the one DGV refuses, routed back around the cluster -->
  <path d="M292,217 L166,217 Q152,217 152,203 L152,154" stroke="#f93c31" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
  <polygon points="0,0 -9,-4 -9,4" fill="#f93c31" transform="translate(152 148) rotate(-90)"/>
  <circle cx="222" cy="217" r="10" fill="#0e0d0b" stroke="#f93c31" stroke-width="1.5"/>
  <text x="222" y="222" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#f93c31">!</text>
  <text x="222" y="246" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#f93c31">kind/store-initiates</text>

  <g transform="translate(78 78)">
    <path d="M22,0 H128 A22,22 0 0 1 128,54 H22 A22,22 0 0 1 22,0 Z" fill="#161513" stroke="#4ec9a5" stroke-width="1.5"/>
    <text x="14" y="20" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.3" fill="#4ec9a5">API</text>
    <text x="14" y="39" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif" font-size="15" font-weight="650" fill="#e6e3de">HTTP API</text>
  </g>
  <g transform="translate(300 78)">
    <path d="M0,7 Q0,0 7,0 H60 l10,9 H143 Q150,9 150,16 V47 Q150,54 143,54 H7 Q0,54 0,47 Z" fill="#161513" stroke="#c98cff" stroke-width="1.5"/>
    <text x="14" y="24" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.3" fill="#c98cff">MODULE</text>
    <text x="14" y="43" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif" font-size="15" font-weight="650" fill="#e6e3de">Agent Loop</text>
  </g>
  <g transform="translate(300 190)">
    <path d="M0,9 A75,9 0 0 1 150,9 V45 A75,9 0 0 1 0,45 Z" fill="#161513" stroke="#c9b458" stroke-width="1.5"/>
    <path d="M0,9 A75,9 0 0 0 150,9" fill="none" stroke="#c9b458" stroke-width="1.5"/>
    <text x="14" y="26" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.3" fill="#c9b458">DATABASE</text>
    <text x="14" y="45" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif" font-size="15" font-weight="650" fill="#e6e3de">Typesense</text>
  </g>

  <!-- ── the wordmark ────────────────────────────────────────────── -->
  <text x="620" y="126" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif" font-size="62" font-weight="700" fill="#e6e3de" letter-spacing="-1">Dia<tspan fill="#e8873a">-</tspan>GramV</text>
  <text x="623" y="166" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif" font-size="18" fill="#a49e95">Plan the architecture before you write the code.</text>
  <text x="623" y="200" font-family="ui-monospace,'SF Mono',SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="0.6" fill="#7d766c">typed nodes · ports on edges · lint that tells you the fix</text>
</svg>
